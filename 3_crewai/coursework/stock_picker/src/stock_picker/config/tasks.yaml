find_best_candidates:
  description: >
    Screen {sector} as of {current_date} and identify exactly 5 individual companies and 2 ETFs
    using fundamental and technical criteria (P/E, growth, valuation, momentum, expense ratio, strategy fit).
    SEARCH LIMIT: use Serper at most 1 time with one broad sector query. Never search per ticker.
    When searching, include {current_date} or its year/month in the query. Do not use 2024 or 2025.
    After at most 1 search, produce your final answer immediately as raw JSON (see expected_output).
  expected_output: >
    Raw JSON only — no markdown, no code fences, no extra text.
    Exact shape:
    {"companies":[{"name":"...","ticker":"...","pe_ratio":"...","investment_potential":"...","valuation_summary":"...","technical_summary":"...","selection_rationale":"..."}],"etfs":[{"name":"...","ticker":"...","expense_ratio":"...","strategy":"...","investment_potential":"...","selection_rationale":"..."}]}
    Requirements: exactly 5 companies and 2 etfs; one short sentence per string field; valid JSON with double-quoted keys.
  agent: investment_screener
  output_file: output/candidate_universe.json

research_candidates:
  description: >
    Using the screened lists from context, analyze each of the 5 companies and 2 ETFs as of {current_date}.
    Cover P/E, growth, valuation, technicals, competitive position, outlook, and risks (one short sentence per field).
    SEARCH LIMIT: use Serper at most 2 times total — one batched query for all stocks, one for both ETFs.
    Never search per ticker. Do not use 2024 or 2025 in queries.
    After at most 2 searches, produce your final answer immediately as raw JSON (see expected_output).
  expected_output: >
    Raw JSON only — no markdown, no code fences, no extra text.
    Exact shape:
    {"companies":[{"name":"...","ticker":"...","pe_ratio":"...","revenue_growth":"...","valuation":"...","technical_analysis":"...","market_position":"...","future_outlook":"...","investment_potential":"..."}],"etfs":[{"name":"...","ticker":"...","expense_ratio":"...","strategy":"...","representative_holdings":"...","performance_summary":"...","technical_analysis":"...","market_position":"...","future_outlook":"...","investment_potential":"..."}]}
    Requirements: one entry per screened company and ETF from context; one short sentence per string field; valid JSON with double-quoted keys.
  agent: financial_researcher
  context:
    - find_best_candidates
  output_file: output/research_report.json

pick_best_companies:
  description: >
    From the research in context, select exactly 3 individual companies and 1 ETF for {sector} as of {current_date}.
    Rank by conviction. Use Send HTML Email once for a brief HTML report (stocks section + ETF section).
    Do not use search tools. After sending email, return raw JSON as your final answer (see expected_output).
  expected_output: >
    Raw JSON only — no markdown, no code fences, no extra text.
    Exact shape:
    {"summary":"...","companies":[{"rank":1,"name":"...","ticker":"...","pe_ratio":"...","rationale":"...","valuation":"...","technical_analysis":"...","outlook":"..."}],"etfs":[{"rank":1,"name":"...","ticker":"...","expense_ratio":"...","rationale":"...","strategy":"...","representative_holdings":"..."}],"companies_not_selected":["TICKER: brief reason"],"etfs_not_selected":["TICKER: brief reason"]}
    Requirements: exactly 3 ranked companies (rank 1-3) and 1 etf (rank 1); one short sentence per string field; valid JSON with double-quoted keys.
  agent: stock_picker
  context:
    - research_candidates
  output_file: output/recommendations.json
